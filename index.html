<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USERS_GOLD Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #2b78e4;
            --success-color: #2e7d32;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add {
            background-color: var(--success-color);
            color: white;
            margin-top: 8px;
        }

        .btn-send {
            background-color: var(--primary-color);
            color: white;
            margin-bottom: 12px;
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
            max-height: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background-color: #1976d2;
            color: white;
            padding: 8px;
            position: sticky;
            top: 0;
            white-space: nowrap;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="form-group">
            <label>MAG</label>
            <input type="number" id="inputMag" placeholder="например, 118" value="118">
        </div>
        <div class="form-group">
            <label>ID</label>
            <input type="number" id="inputId" placeholder="например, 318" value="318">
        </div>
        <div class="form-group">
            <label>Программа</label>
            <select id="selectProgram">
                <option value="GOLD">GOLD</option>
                <option value="GSM2">GSM2</option>
            </select>
        </div>
        <div class="form-group">
            <label>Фамилия</label>
            <input type="text" id="inputLastName" placeholder="Фамилия" value="Racu">
        </div>
        <div class="form-group">
            <label>Имя</label>
            <input type="text" id="inputFirstName" placeholder="Имя" value="Ion">
        </div>
        <div class="form-group">
            <label>Функция</label>
            <input type="text" id="inputFunction" placeholder="Функция / Должность" value="Оператор">
        </div>

        <button class="btn btn-add" id="btnAdd">Добавить в таблицу</button>
    </div>

    <div class="card">
        <h3>Пользователи</h3>
        <button class="btn btn-send" id="btnSend">Отправить в Telegram</button>

        <div class="table-container">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>MAG</th>
                        <th>ID</th>
                        <th>ПРОГРАММА</th>
                        <th>ФАМИЛИЯ</th>
                        <th>ИМЯ</th>
                        <th>ФУНКЦИЯ</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Записи будут попадать сюда -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const BACKEND_URL = "https://telegram-users-xiba.onrender.com/api/upload";
        let usersData = [];

        const btnAdd = document.getElementById('btnAdd');
        const btnSend = document.getElementById('btnSend');
        const tableBody = document.getElementById('tableBody');

        btnAdd.addEventListener('click', () => {
            const mag = document.getElementById('inputMag').value;
            const id = document.getElementById('inputId').value;
            const program = document.getElementById('selectProgram').value;
            const lastName = document.getElementById('inputLastName').value;
            const firstName = document.getElementById('inputFirstName').value;
            const func = document.getElementById('inputFunction').value;

            if (!mag || !id || !lastName || !firstName || !func) {
                alert("Заполните все поля формы!");
                return;
            }

            const newUser = {
                num: usersData.length + 1,
                mag: mag,
                id: id,
                program: program,
                lastName: lastName,
                firstName: firstName,
                func: func
            };

            usersData.push(newUser);
            renderTable();
        });

        function renderTable() {
            tableBody.innerHTML = '';
            usersData.forEach((u, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${u.mag}</td>
                    <td>${u.id}</td>
                    <td>${u.program}</td>
                    <td>${u.lastName}</td>
                    <td>${u.firstName}</td>
                    <td>${u.func}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function generateExcelBase64() {
            const wsData = [
                ["№", "MAG", "ID", "ПРОГРАММА", "ФАМИЛИЯ", "ИМЯ", "ФУНКЦИЯ"]
            ];

            usersData.forEach((u, index) => {
                wsData.push([index + 1, u.mag, u.id, u.program, u.lastName, u.firstName, u.func]);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Users");

            return XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
        }

        btnSend.addEventListener('click', async () => {
            if (usersData.length === 0) {
                alert("Сначала добавьте хотя бы одного пользователя!");
                return;
            }

            btnSend.disabled = true;
            btnSend.innerText = "Отправка...";

            try {
                const base64Data = generateExcelBase64();
                const initData = tg ? tg.initData : '';

                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        file_base64: base64Data,
                        filename: 'users_gold.xlsx',
                        initData: initData
                    })
                });

                const result = await response.json();

                if (response.ok && result.status === 'ok') {
                    if (tg) {
                        tg.close();
                    } else {
                        alert("Файл успешно отправлен!");
                    }
                } else {
                    alert("Ошибка: " + (result.detail || "Не удалось отправить файл"));
                }
            } catch (err) {
                alert("Ошибка сети: " + err.message);
            } finally {
                btnSend.disabled = false;
                btnSend.innerText = "Отправить в Telegram";
            }
        });
    </script>
</body>
</html>
